name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swiftlint:
    runs-on: ubuntu-24.04
    # SwiftLint's own image, pinned by digest (the 0.65.0 tag when pinned).
    container:
      image: ghcr.io/realm/swiftlint@sha256:a482729f4b58741875af1566f23397f3f6db300372756fc31606d0a4527fab9e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
