name: Bug report
description: Something in Aoide for iPhone doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out anything private: your server's address, usernames and tokens. A security problem goes through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an album
        2. Tap Play
        3. …
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit you built
      description: "`git rev-parse --short HEAD` in your checkout."
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: "iPhone 17 Pro, iOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - On the phone
        - CarPlay
        - Siri
        - SharePlay or AirPlay
        - Sync with the Linux app
  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin version, and the sidecar's if installed
      placeholder: "Jellyfin 10.11.0, sidecar 1.18.0.0"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings → Diagnostics writes the app's log from the last half hour to a file. Attach it, after checking it for addresses and names.
