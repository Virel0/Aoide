name: Feature request
description: Something Aoide for iPhone could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task, in your words, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Optional; the need above matters more.
  - type: dropdown
    id: linux
    attributes:
      label: Does the Linux app do this?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
