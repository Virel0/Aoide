# Weekly update pull requests, grouped so a week's minor and patch updates
# arrive as one PR per ecosystem. Security updates come separately, as soon
# as an advisory is published.
version: 2
updates:
  - package-ecosystem: swift
    directory: /Packages/CurationKit
    schedule:
      interval: weekly
    groups:
      swift:
        update-types: [minor, patch]

  # Actions are pinned by commit; Dependabot moves the pin and the version
  # comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
