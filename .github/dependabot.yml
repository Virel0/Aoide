# Weekly update pull requests, grouped so a week's minor and patch updates
# arrive as one PR per ecosystem. A new version waits 7 days before it is
# proposed, so a bad release has time to be caught and pulled. Security
# updates come separately, as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: swift
    directory: /Packages/CurationKit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      swift:
        update-types: [minor, patch]

  # Actions are pinned by commit; Dependabot moves the pin and the version
  # comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
