# Tests may force-unwrap and `try!`: a failure there is a failed test, which
# is the point. Fixture-heavy test files may also run longer.
disabled_rules:
  - force_unwrapping
  - force_try
file_length:
  warning: 1000
  error: 2500
  ignore_comment_only_lines: true
type_body_length:
  warning: 800
  error: 2000
line_length:
  warning: 160
  error: 1000
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
