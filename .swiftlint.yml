# SwiftLint, set to the project's code-size and safety guidelines:
# files under 500 lines (1,000 at most), functions under 50 (100 at most),
# one job per type, and no force-unwraps or `try!` outside tests. Errors fail
# CI (.github/workflows/lint.yml); warnings are shown on the pull request.
#
#   swiftlint lint          # from the repository root

included:
  - Aoide
  - Packages/CurationKit/Sources
  - Packages/CurationKit/Tests
  - Packages/MeleteKit/Sources
  - Packages/MeleteKit/Tests
  - Packages/PlaybackKit/Sources
  - Packages/PlaybackKit/Tests

opt_in_rules:
  - force_unwrapping

# The code's own style: trailing commas in multi-line literals keep diffs to
# one line per change.
disabled_rules:
  - trailing_comma

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true
function_body_length:
  warning: 50
  error: 100
type_body_length:
  warning: 300
  error: 600
cyclomatic_complexity:
  warning: 15
  error: 25
force_unwrapping: error
force_try: error

# One-letter names are fine for maths and short closures (a, b, t, i).
identifier_name:
  min_length: 1
  max_length:
    warning: 50
    error: 70
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
